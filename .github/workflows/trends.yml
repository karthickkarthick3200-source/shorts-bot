name: trends
on:
  schedule:
    - cron: "30 0 * * 1"     # every Monday, 06:00 India time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_trends.py
      - name: Save trends
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends_auto.txt || true
          git diff --cached --quiet || (git commit -m "weekly trends" && git pull --rebase -X theirs && git push)
