name: shorts
on:
  schedule:
    - cron: "0 1,5,9,13,17 * * *"   # 5 Shorts a day
    - cron: "0 21 * * *"            # 1 long video a day
  workflow_dispatch:
    inputs:
      kind:
        description: "short or long"
        type: choice
        options: [short, long]
        default: short
permissions:
  contents: write
concurrency: shorts
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || (github.event.schedule == '0 21 * * *' && 'long' || 'short') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          # caption fonts: a missing one is skipped, it never breaks the run
          for p in fonts-oswald fonts-open-sans fonts-montserrat fonts-comic-neue fonts-liberation; do
            sudo apt-get install -y "$p" || true
          done
          fc-cache -f
          pip install -r requirements.txt
          pip install -U edge-tts requests pillow
      - name: Generate video
        run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          NICHE: ${{ vars.NICHE }}
          VOICE: ${{ vars.VOICE }}
          IMAGE_STYLE: ${{ vars.IMAGE_STYLE }}
      - name: Temporary public URL
        id: rel
        if: ${{ env.KIND == 'short' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_id }}"
          gh release create "$TAG" out/final.mp4 --title "$TAG" --notes "temp"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/final.mp4" >> "$GITHUB_OUTPUT"
      - name: Upload to YouTube
        run: python upload_youtube.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: Upload to Instagram
        if: ${{ !cancelled() && env.KIND == 'short' && steps.rel.outputs.url != '' }}
        run: python upload_instagram.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          VIDEO_URL: ${{ steps.rel.outputs.url }}
      - name: Remove temporary release
        if: ${{ always() && steps.rel.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.rel.outputs.tag }}" --cleanup-tag -y
      - name: Save topic history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || (git commit -m "history" && git pull --rebase -X theirs && git push)
